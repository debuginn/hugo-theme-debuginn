{{- $cfg := partial "functions/site-config.html" . -}}
<!doctype html>
<html lang="{{ default site.Language.Lang $cfg.site.lang }}">
  <head>{{ partial "head.html" . }}</head>
  <body>{{ block "main" . }}{{ end }}<svg class="liquid-glass-defs" width="0" height="0" aria-hidden="true" focusable="false"><filter id="profile-liquid-glass" x="-35%" y="-80%" width="170%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="soft"></feGaussianBlur><feImage href="" x="0" y="0" width="100%" height="100%" result="map"></feImage><feDisplacementMap in="soft" in2="map" scale="56" xChannelSelector="R" yChannelSelector="G" result="bent"></feDisplacementMap><feColorMatrix in="bent" type="saturate" values="1.8"></feColorMatrix></filter></svg>{{ partial "scripts.html" . }}</body>
</html>
