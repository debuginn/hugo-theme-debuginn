{{- $icon := . -}}
{{- if eq $icon "home" -}}
<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9v11h14V9M9 20v-6h6v6"/></svg>
{{- else if or (eq $icon "product") (eq $icon "iassets") -}}
<svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10 5.5h4M11 18.5h2"/></svg>
{{- else if or (eq $icon "flybay") (eq $icon "extension") -}}
<svg viewBox="0 0 24 24"><path d="M21 3 9.5 14.5M21 3l-7 18-4.5-6.5L3 10l18-7Z"/></svg>
{{- else if eq $icon "blog" -}}
<svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5Z"/><path d="M15 3v5h5M8 12h8M8 16h8"/></svg>
{{- else if eq $icon "social" -}}
<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6"/></svg>
{{- else -}}
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/></svg>
{{- end -}}
